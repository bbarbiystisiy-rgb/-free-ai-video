<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الذكاء الاصطناعي الآمنة 100%</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #121212; color: #fff; }
        .sidebar { width: 280px; background-color: #1e1e1e; padding: 20px; border-left: 1px solid #2d2d2d; display: flex; flex-direction: column; gap: 15px; }
        .sidebar h3 { font-size: 18px; margin-bottom: 10px; color: #00adb5; border-bottom: 2px solid #2d2d2d; padding-bottom: 10px; }
        .char-container { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .char-card { background: #252525; padding: 12px; border-radius: 10px; cursor: pointer; text-align: center; border: 2px solid transparent; transition: 0.3s; display: flex; align-items: center; gap: 15px; }
        .char-card:hover { background: #2d2d2d; }
        .char-card.active { border-color: #00adb5; background: #2d2d2d; }
        .char-avatar { width: 45px; height: 45px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        h1 { font-size: 26px; color: #fff; }
        .input-section { background: #1e1e1e; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #2d2d2d; }
        textarea { width: 100%; height: 100px; background: #252525; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 15px; resize: none; font-size: 16px; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #00adb5; }
        .style-group { display: flex; flex-direction: column; gap: 8px; }
        .styles-container { display: flex; gap: 10px; flex-wrap: wrap; }
        .style-btn { background: #252525; border: 1px solid #333; color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .style-btn:hover { background: #2d2d2d; }
        .style-btn.active { background: #00adb5; border-color: #00adb5; font-weight: bold; }
        .gen-btn { background: #00adb5; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .gen-btn:hover { background: #008c95; }
        .preview-section { background: #1e1e1e; border-radius: 12px; flex: 1; display: flex; justify-content: center; align-items: center; border: 2px dashed #333; min-height: 300px; position: relative; }
        .video-placeholder { color: #666; font-size: 16px; text-align: center; padding: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00adb5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-box { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>1. اختر الشخصية</h3>
        <div class="char-container">
            <div class="char-card active" data-char="Astronaut"><div class="char-avatar">👨‍🚀</div><span>رائد فضاء</span></div>
            <div class="char-card" data-char="Business man"><div class="char-avatar">💼</div><span>رجل أعمال</span></div>
            <div class="char-card" data-char="Anime girl"><div class="char-avatar">👧</div><span>فتاة أنمي</span></div>
            <div class="char-card" data-char="Robot"><div class="char-avatar">🤖</div><span>روبوت آلي</span></div>
        </div>
    </div>
    <div class="main-content">
        <h1>صانع التصاميم بالذكاء الاصطناعي الآمن وبدون مفاتيح</h1>
        <div class="input-section">
            <h3>2. اكتب ماذا تفعل الشخصية (بالإنجليزي)</h3>
            <textarea id="promptInput" placeholder="مثال: running, flying, smiling..."></textarea>
            <div class="style-group">
                <h3>3. اختر الستايل</h3>
                <div class="styles-container">
                    <button class="style-btn active" data-style="cinematic">سينمائي 🎬</button>
                    <button class="style-btn" data-style="anime">أنمي 🎨</button>
                    <button class="style-btn" data-style="3d-render">ثلاثي الأبعاد 🧸</button>
                </div>
            </div>
            <button class="gen-btn" id="generateBtn">توليد الآن بأمان ✨</button>
        </div>
        <div class="preview-section" id="previewSection">
            <div class="video-placeholder" id="placeholderText">سيظهر تصميمك الآمن هنا بدون أي مفاتيح...</div>
        </div>
    </div>
    <script>
        let selectedCharacter = "Astronaut"; let selectedStyle = "cinematic";
        document.querySelectorAll('.char-card').forEach(card => { card.addEventListener('click', () => { document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active')); card.classList.add('active'); selectedCharacter = card.getAttribute('data-char'); }); });
        document.querySelectorAll('.style-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); selectedStyle = btn.getAttribute('data-style'); }); });

        document.getElementById('generateBtn').addEventListener('click', () => {
            const userPrompt = document.getElementById('promptInput').value.trim();
            if(!userPrompt) { alert("من فضلك اكتب الوصف أولاً!"); return; }

            // عرض تأثير التحميل مباشرة جوه المربع
            document.getElementById('previewSection').innerHTML = `<div class="loading-box"><div class="loader"></div><p>جاري رسم صورتك الآمنة حالياً...</p></div>`;

            const seed = Math.floor(Math.random() * 1000000);
            const finalPrompt = encodeURIComponent(`${selectedCharacter} ${userPrompt} ${selectedStyle} 4k highly detailed`);
            const imageUrl = `https://image.pollinations.ai/p/${finalPrompt}?width=800&height=600&seed=${seed}&nologo=true`;

            // هنعرض الصورة جوه الكود مباشرة وخلي المتصفح يحملها براحته بدون شروط أمنية معقدة
            setTimeout(() => {
                document.getElementById('previewSection').innerHTML = `<img src="${imageUrl}" width="100%" height="100%" style="border-radius:12px; object-fit: cover;" alt="AI Image">`;
            }, 1000); 
        });
    </script>
</body>
</html>
